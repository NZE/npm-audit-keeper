name: Stage npm release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-stage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install npm with staged publishing support
        run: npm install --global npm@11.19.1
      - name: Verify release tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          name=$(node -p "require('./package.json').name")
          test "$name" = "npm-audit-keeper"
          test "$GITHUB_REF_NAME" = "v$version"
          test "$lock_version" = "$version"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run audit
      - run: npm run test:package
      - name: Stage for maintainer approval
        run: npm stage publish --registry=https://registry.npmjs.org/
